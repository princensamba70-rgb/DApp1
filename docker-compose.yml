services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Parametres separes : un mot de passe PostgreSQL avec @, :, /, # ou %
      # ne doit pas etre interprete comme une URL de connexion.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requis}
      USER1_USERNAME: ${USER1_USERNAME:-user1}
      USER1_PASSWORD: ${USER1_PASSWORD:?USER1_PASSWORD requis}
      SURVEY_ENCRYPTION_KEY: ${SURVEY_ENCRYPTION_KEY:?SURVEY_ENCRYPTION_KEY requis}
      SURVEY_ALLOW_HTTP: ${SURVEY_ALLOW_HTTP:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      # Une base existante peut prendre plus de temps a migrer/initialiser.
      start_period: 60s
      retries: 8
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Faux serveur conforme aux routes REST documentees ; profile de test uniquement.
  mock-survey:
    image: node:22-alpine
    profiles: [test]
    working_dir: /app
    command: ["node", "/app/mock-survey.cjs"]
    volumes:
      - ./tests/mock-survey.cjs:/app/mock-survey.cjs:ro
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
